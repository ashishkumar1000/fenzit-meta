version: 1
workspace_root: workspace
core_root: workspace/core
external_root: workspace/external

# Registered repos that this meta repo governs and clones on setup.
# Add a new entry here (and a matching docs/repos/<id>/ folder) whenever
# a new repo should be pulled into the workspace automatically.
repos:
  - id: fenzo-app
    path: workspace/core/frontend/fenzo-app
    remote: https://github.com/ashishkumar1000/fenzo-app.git
    role: frontend
    default_branch: main
    status: active
    docs_dir: docs/repos/fenzo-app

  - id: fenzit-be
    path: workspace/core/backend/fenzit-be
    remote: https://github.com/ashishkumar1000/fenzit-be.git
    role: backend
    default_branch: main
    status: active
    docs_dir: docs/repos/fenzit-be
